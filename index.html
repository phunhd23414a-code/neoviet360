    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Khởi tạo Canvas Background
        const canvas = document.getElementById('bg-canvas');
        if (canvas) {
            const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
            let width, height, dpr;
            let particles = [];
            let currencies = [];
            let animationId = null;
            let isScrolling = false;
            let scrollIdleTimer = null;
            let lastFrameTime = performance.now();
            let fpsEMA = 60;
            let quality = 1;
            const pointer = { x: -9999, y: -9999, active: false };
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const isSmallScreen = window.matchMedia('(max-width: 768px)').matches;
            const baseParticleCount = isSmallScreen ? 20 : 40;
            const baseCurrencyCount = 0; // Disabled for performance
            const currencySymbols = ['$', '€', '¥', '₫', '₿', '₩'];

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, isSmallScreen ? 1.35 : 1.75);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resize, { passive: true });
            window.addEventListener('pointermove', (event) => {
                pointer.x = event.clientX;
                pointer.y = event.clientY;
                pointer.active = true;
                document.documentElement.style.setProperty('--pointer-x', `${event.clientX}px`);
                document.documentElement.style.setProperty('--pointer-y', `${event.clientY}px`);
            }, { passive: true });
            window.addEventListener('pointerleave', () => {
                pointer.active = false;
            }, { passive: true });
            resize();

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(randomY = false) {
                    this.x = Math.random() * width;
                    this.y = randomY ? Math.random() * height : height + 24;
                    this.depth = Math.random() * 0.75 + 0.35;
                    this.vx = (Math.random() - 0.5) * (0.34 + this.depth * 0.26);
                    this.vy = (Math.random() - 0.5) * (0.28 + this.depth * 0.18);
                    this.radius = (Math.random() * 1.9 + 0.55) * this.depth;
                    this.phase = Math.random() * Math.PI * 2;
                    this.hue = Math.random() > 0.62 ? 'cyan' : (Math.random() > 0.78 ? 'violet' : 'emerald');
                    this.alpha = (Math.random() * 0.28 + 0.12) * this.depth;
                }
                update(speed = 1) {
                    this.phase += 0.012 * speed;
                    const pointerPull = pointer.active ? Math.max(0, 1 - Math.hypot(this.x - pointer.x, this.y - pointer.y) / 180) : 0;
                    this.x += (this.vx + Math.sin(this.phase) * 0.06 + (this.x - pointer.x) * pointerPull * 0.002) * speed;
                    this.y += (this.vy + Math.cos(this.phase * 0.7) * 0.045 + (this.y - pointer.y) * pointerPull * 0.002) * speed;
                    if (this.x < -50) this.x = width + 50;
                    if (this.x > width + 50) this.x = -50;
                    if (this.y < -50) this.y = height + 50;
                    if (this.y > height + 50) this.y = -50;
                }
                draw() {
                    const palette = {
                        emerald: `rgba(0, 230, 118, ${this.alpha})`,
                        cyan: `rgba(0, 245, 255, ${this.alpha})`,
                        violet: `rgba(168, 85, 247, ${this.alpha})`
                    };

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = palette[this.hue];
                    ctx.fill();

                    if (quality > 0.72 && this.depth > 0.8) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius * 3.2, 0, Math.PI * 2);
                        ctx.fillStyle = palette[this.hue].replace(/[\d.]+\)$/, `${this.alpha * 0.18})`);
                        ctx.fill();
                    }
                }
            }

            class Currency {
                constructor() {
                    this.reset(true);
                }
                reset(randomY = false) {
                    this.x = Math.random() * width;
                    this.y = randomY ? Math.random() * height : height + 60;
                    this.depth = Math.random() * 0.8 + 0.45;
                    this.vx = (Math.random() - 0.5) * (0.48 + this.depth * 0.22);
                    this.vy = -(Math.random() * 0.72 + 0.24) * this.depth;
                    this.symbol = currencySymbols[Math.floor(Math.random() * currencySymbols.length)];
                    this.size = (Math.random() * 14 + 10) * this.depth;
                    this.opacity = (Math.random() * 0.26 + 0.1) * this.depth;
                    this.rotation = (Math.random() - 0.5) * 0.45;
                    this.phase = Math.random() * Math.PI * 2;
                }
                update(speed = 1) {
                    this.phase += 0.017 * speed;
                    this.x += (this.vx + Math.sin(this.phase) * 0.22) * speed;
                    this.y += this.vy * speed;
                    if (this.y < -60 || this.x < -80 || this.x > width + 80) this.reset(false);
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation + Math.sin(this.phase) * 0.14);
                    ctx.font = `800 ${this.size}px "Outfit", sans-serif`;
                    ctx.fillStyle = `rgba(0, 245, 255, ${this.opacity})`;
                    if (quality > 0.78) {
                        ctx.shadowColor = 'rgba(0, 245, 255, 0.35)';
                        ctx.shadowBlur = 8;
                    }
                    ctx.fillText(this.symbol, 0, 0);
                    ctx.restore();
                }
            }

            for (let i = 0; i < baseParticleCount; i++) particles.push(new Particle());
            for (let i = 0; i < baseCurrencyCount; i++) currencies.push(new Currency());

            // Disabled for performance - was causing major FPS drops
            function drawPointerHalo() { return; }

            function drawConnections() {
                // Only draw connections when FPS is high (>50), otherwise skip
                if (fpsEMA < 50 || isScrolling) return;
                const maxDist = 132;
                const maxDistSq = maxDist * maxDist;
                const step = 2;
                const maxLines = 50;
                let lines = 0;

                for (let i = 0; i < particles.length && lines < maxLines; i += step) {
                    const p = particles[i];
                    for (let j = i + 1; j < particles.length && lines < maxLines; j += step) {
                        const q = particles[j];
                        const dx = p.x - q.x;
                        const dy = p.y - q.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < maxDistSq) {
                            const strength = 1 - distSq / maxDistSq;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(q.x, q.y);
                            ctx.strokeStyle = `rgba(0, 245, 255, ${strength * 0.08})`;
                            ctx.lineWidth = 0.28 + strength * 0.42;
                            ctx.stroke();
                            lines++;
                        }
                    }
                }
            }

            function animate(now = performance.now()) {
                animationId = requestAnimationFrame(animate);

                if (document.hidden) return;

                const delta = Math.min(32, now - lastFrameTime);
                lastFrameTime = now;
                const currentFps = 1000 / Math.max(delta, 1);
                fpsEMA = fpsEMA * 0.94 + currentFps * 0.06;
                if (fpsEMA < 42) quality = Math.max(0.52, quality - 0.015);
                if (fpsEMA > 55 && !isScrolling) quality = Math.min(1, quality + 0.006);

                const speed = Math.min(1.35, delta / 16.67);
                ctx.clearRect(0, 0, width, height);

                drawPointerHalo();
                particles.forEach(p => { p.update(speed); p.draw(); });
                if (fpsEMA > 50) currencies.forEach(c => { c.update(speed); c.draw(); });
                drawConnections();
            }

            window.addEventListener('scroll', () => {
                isScrolling = true;
                document.body.classList.add('is-scrolling');
                quality = Math.max(0.58, quality - 0.025);
                clearTimeout(scrollIdleTimer);
                scrollIdleTimer = setTimeout(() => {
                    isScrolling = false;
                    document.body.classList.remove('is-scrolling');
                }, 90);
            }, { passive: true });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                } else if (!document.hidden && !animationId && !prefersReducedMotion) {
                    animate();
                }
            });

            if (!prefersReducedMotion) animate();
        }

        // Khởi tạo luồng kiểm tra session và chuyển hướng trang
        router.init();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
              console.log('SW registered:', reg);
            }).catch(err => {
              console.log('SW registration failed:', err);
            });
          });
        }
      });
    </script>
